name: Build macOS/Windows

# Manual only: nothing here ever starts on its own, because macOS minutes
# cost ten times as much on private repositories.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options:
          - windows
          - macos
          - both
        default: windows
      run_tests:
        description: Run the unit tests and the selftest
        type: boolean
        default: true
      make_installers:
        description: Make the DMG (macOS) and the installer (Windows), not only the app and the zip
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Windows stays on 6.10 until aqtinstall can read the newer Windows
  # repository layout (6.11 and later fail with "Failed to locate XML data").
  QT_VERSION_MACOS: "6.12.0"
  QT_VERSION_WINDOWS: "6.10.3"

jobs:
  macos:
    if: inputs.platforms == 'macos' || inputs.platforms == 'both'
    runs-on: macos-14
    timeout-minutes: 45
    env:
      FAIRFAX_SKIP_TESTS: ${{ inputs.run_tests && '0' || '1' }}
      FAIRFAX_SKIP_DMG: ${{ inputs.make_installers && '0' || '1' }}
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.MACOS_NOTARY_APPLE_ID != '' && secrets.MACOS_NOTARY_TEAM_ID != '' && secrets.MACOS_NOTARY_PASSWORD != '' }}
    steps:
      # Actions are pinned to commit SHAs, with the release in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION_MACOS }}
          cache: true

      # Only when the signing secrets exist: import the certificate into a
      # temporary keychain.
      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/fairfax.keychain-db"
          pass="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Store the notarisation credentials
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials fairfax-notary \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"

      - name: Build
        env:
          FAIRFAX_SIGN_IDENTITY: ${{ env.HAS_CERT == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          FAIRFAX_NOTARY_PROFILE: ${{ env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true' && 'fairfax-notary' || '' }}
        run: bin/build-macos

      - name: Zip the app
        if: env.FAIRFAX_SKIP_DMG == '1'
        run: ditto -c -k --keepParent build-macos/Fairfax.app build-macos/Fairfax-app.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fairfax-macos
          retention-days: 5
          if-no-files-found: warn
          path: |
            build-macos/*.dmg
            build-macos/Fairfax-app.zip
            build-macos/*.log

  windows:
    if: inputs.platforms == 'windows' || inputs.platforms == 'both'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      FAIRFAX_SKIP_TESTS: ${{ inputs.run_tests && '0' || '1' }}
      FAIRFAX_SKIP_INSTALLER: ${{ inputs.make_installers && '0' || '1' }}
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
    steps:
      # Actions are pinned to commit SHAs, with the release in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION_WINDOWS }}
          arch: win64_msvc2022_64
          cache: true

      # zlib for zipped backups, linked statically against the dynamic CRT
      # (/MD) like the rest of the build; vcpkg comes with the runner.
      - name: Install zlib
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ZLIB_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        if: env.FAIRFAX_SKIP_INSTALLER == '0'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Write the signing certificate
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'fairfax-sign.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT_PFX))
          "FAIRFAX_SIGN_CERT=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: pwsh
        env:
          FAIRFAX_SIGN_PASSWORD: ${{ env.HAS_CERT == 'true' && secrets.WINDOWS_CERT_PASSWORD || '' }}
        run: ./bin/build-windows.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fairfax-windows
          retention-days: 5
          if-no-files-found: warn
          path: |
            build-windows/*.zip
            build-windows/*-setup.exe
            build-windows/*.log
